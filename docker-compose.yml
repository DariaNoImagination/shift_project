services:
  db:
    image: postgres:16
    env_file:
      - .env
    container_name: booking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - booking_network

  app:
    build: .
    container_name: booking_app
    env_file:
      - .env
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: always
    networks:
      - booking_network

volumes:
  postgres_data:

networks:
  booking_network:
    driver: bridge